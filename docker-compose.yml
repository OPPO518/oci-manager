services:
  oci-manager:
    # 默认使用 GitHub Actions 预构建的镜像，VPS 上无需现场编译。
    # 如需本地构建：docker compose up -d --build
    image: ${OCI_MANAGER_IMAGE:-ghcr.io/oppo518/oci-manager:latest}
    build:
      context: .
      # 国内 VPS 建议保留下方镜像源；海外 VPS 可改成官方源或直接删掉 args 块
      args:
        GOPROXY: https://goproxy.cn,direct
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: oci-manager
    restart: unless-stopped
    # 对外 ports 故意不写在这里：由 install.sh 按「HTTP 模式 / HTTPS 模式」
    # 生成 docker-compose.override.yml 提供。compose 的 ports 是「追加合并」，
    # 基础文件若含 ports，override 无法删掉不要的那条（例如首次部署的 443）。
    # HTTP 与 HTTPS 共用同一个宿主机端口（OCI_MANAGER_PORT）：
    #   · 首次部署（无证书）：只映射 ${OCI_MANAGER_PORT}:8080，完全不映射 443
    #   · 证书已签发：宿主机不暴露 HTTP，只映射 ${OCI_MANAGER_PORT}:8443
    volumes:
      - ./data:/data
    environment:
      OCI_MANAGER_ADDR: ":8080"
      OCI_MANAGER_HTTPS_ADDR: ":8443"
      OCI_MANAGER_DB: "/data/oci-manager.db"
      # 用于加密数据库中存储的 OCI API 私钥，取自同目录下的 .env
      # 生成方式：openssl rand -hex 32
      # 修改此值会导致已保存的账号无法解密，请勿在录入账号后随意更改
      OCI_MANAGER_ENCRYPTION_KEY: ${OCI_MANAGER_ENCRYPTION_KEY:?请先在 .env 中设置 OCI_MANAGER_ENCRYPTION_KEY}
    healthcheck:
      # GET 探测：--spider 发 HEAD，/api/health 只注册了 GET，会被判 404
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
