services:
  oci-manager:
    build: .
    image: oci-manager:latest
    container_name: oci-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      OCI_MANAGER_ADDR: ":8080"
      OCI_MANAGER_DB: "/data/oci-manager.db"
      # 用于加密数据库中存储的 API 私钥，部署前请替换为随机字符串
      # 生成方式：openssl rand -hex 32
      OCI_MANAGER_ENCRYPTION_KEY: "change-me-before-deploy"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
